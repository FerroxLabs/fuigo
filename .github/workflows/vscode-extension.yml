# VS Code extension (editors/vscode): lint, typecheck, unit tests, integration tests against a fuigo-pager built from
# this checkout (the extension pins the fuigo/* wire, so it is tested against the same tree), then `vsce package`.
# The integration suite runs twice: from the dev folder, then from the packaged VSIX installed into VS Code.
#
# Path-filtered on purpose: it only matters for extension changes, so it is not meant to be a required check (a
# path-filtered required check blocks PRs that miss the filter; see binary-driven-tests.yml).
#
# Publishing: only on a `vscode-v<version>` tag, after the checks pass, through the `vscode-publish` environment.
# No stored tokens: both registries trust this workflow through GitHub OIDC (trusted publishing). The VS Code
# Marketplace policy (publisher ferroxlabs) and the Open VSX trusted publisher (namespace ferroxlabs) both pin this repo,
# this workflow file and the vscode-publish environment; any other caller gets no publish token. Exception: Open VSX's
# first version needs an OVSX_PAT environment secret (see the Open VSX step).
name: vscode extension
on:
  pull_request:
    paths: ['editors/vscode/**', '.github/workflows/vscode-extension.yml']
  push:
    branches: [main, 'release/**']
    paths: ['editors/vscode/**', '.github/workflows/vscode-extension.yml']
    tags: ['vscode-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
    working-directory: editors/vscode
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Package the VSIX
        run: |
          set -euo pipefail
          npm run package
          VSIX=$(ls fuigo-*.vsix)
          sha256sum "$VSIX" | tee "$VSIX.sha256"
          echo "VSIX_FILE=$VSIX" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (action default toolchain: stable)
      - name: Prepare pinned protoc
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 300 https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: vscode-extension
          cache-on-failure: true
      - name: Build fuigo-pager from this checkout
        working-directory: .
        run: |
          cargo build --locked -p fuigo-pager-bin --bin fuigo-pager
          echo "FUIGO_BIN=$GITHUB_WORKSPACE/target/debug/fuigo-pager" >> "$GITHUB_ENV"
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      # Every model URL points at the local mock (test/fixtures/mock-model.py) and the API key is fake, so no model
      # call can leave the runner even without the network namespace (NO_UNSHARE: the runner user has no userns).
      - name: Integration tests (dev folder)
        env:
          NO_UNSHARE: '1'
        run: npm run test:integration -- "$RUNNER_TEMP/itest-dev"
      - name: Integration tests (installed VSIX)
        env:
          NO_UNSHARE: '1'
          VSIX: ${{ env.VSIX_FILE }}
        run: bash test/integration/run.sh "$RUNNER_TEMP/itest-vsix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuigo-vsix
          path: |
            editors/vscode/fuigo-*.vsix
            editors/vscode/fuigo-*.vsix.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: vscode-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install the pinned vsce and ovsx
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fuigo-vsix
          path: editors/vscode/release
      - name: Check the tag matches the packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "vscode-v$VERSION" ] || { echo "::error::tag $TAG does not match package.json version $VERSION"; exit 1; }
          VSIX="release/fuigo-$VERSION.vsix"
          (cd release && sha256sum -c "fuigo-$VERSION.vsix.sha256")
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"
      # The same VSIX bytes go to both registries.
      - name: Publish to the VS Code Marketplace
        run: npx --no-install vsce publish --oidc --packagePath "$VSIX"
      # Open VSX only accepts a trusted publisher for an extension that already exists, so the first version goes up
      # with OVSX_PAT; once the trusted publisher is registered the secret is deleted and this falls through to OIDC.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --no-install ovsx publish "$VSIX"
          else
            npx --no-install ovsx publish --trusted-publishing "$VSIX"
          fi
