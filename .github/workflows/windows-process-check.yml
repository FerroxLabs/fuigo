name: Windows process ownership check
# Windows-only process ownership: attached-child termination, the parent-death
# watcher and the leader's creation flags. Nothing on Linux or macOS covers
# them, so this is a gate on every change to the code that owns that behaviour.
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'crates/codegen/fuigo-tty-utils/**'
      - 'crates/codegen/fuigo-shell/src/leader/**'
      # The one production line that arms the parent-death watcher for
      # `fuigo agent stdio`; the pager-bin path below holds the other arm site.
      - 'crates/codegen/fuigo-shell/src/agent/app.rs'
      - 'crates/codegen/fuigo-pager-bin/src/main.rs'
      # The manifests those sources need to compile: the root one carries the
      # `windows` crate features `parent_death_windows.rs` needs, fuigo-shell's
      # the `fuigo-tty-utils = { features = ["testing"] }` dev-dependency the
      # arm pin needs. No other workflow builds this tree for Windows on a PR,
      # so without these a manifest-only change breaks the build or the pin
      # with the gate never running.
      - 'Cargo.toml'
      - 'crates/codegen/fuigo-shell/Cargo.toml'
      # The cache-bypass gate added for 1.0.18 runs fuigo-sampler's integration test, which builds
      # through fuigo-test-support's TestSandbox. Neither was watched here, so the step could break
      # with the gate never running -- the gap C-R6-3 closed for the manifests, in the step after it.
      - 'crates/codegen/fuigo-sampler/**'
      - 'crates/codegen/fuigo-test-support/**'
      - '.github/workflows/windows-process-check.yml'
  pull_request:
    paths:
      - 'crates/codegen/fuigo-tty-utils/**'
      - 'crates/codegen/fuigo-shell/src/leader/**'
      # The one production line that arms the parent-death watcher for
      # `fuigo agent stdio`; the pager-bin path below holds the other arm site.
      - 'crates/codegen/fuigo-shell/src/agent/app.rs'
      - 'crates/codegen/fuigo-pager-bin/src/main.rs'
      # The manifests those sources need to compile: the root one carries the
      # `windows` crate features `parent_death_windows.rs` needs, fuigo-shell's
      # the `fuigo-tty-utils = { features = ["testing"] }` dev-dependency the
      # arm pin needs. No other workflow builds this tree for Windows on a PR,
      # so without these a manifest-only change breaks the build or the pin
      # with the gate never running.
      - 'Cargo.toml'
      - 'crates/codegen/fuigo-shell/Cargo.toml'
      # The cache-bypass gate added for 1.0.18 runs fuigo-sampler's integration test, which builds
      # through fuigo-test-support's TestSandbox. Neither was watched here, so the step could break
      # with the gate never running -- the gap C-R6-3 closed for the manifests, in the step after it.
      - 'crates/codegen/fuigo-sampler/**'
      - 'crates/codegen/fuigo-test-support/**'
      - '.github/workflows/windows-process-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    # A cold fuigo-shell debug test build dominates (~40 min observed on a cold
    # cache); the tty-utils suite runs first so its own failures are not hidden
    # behind that build.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel; this only guarantees rustup exists.
      - uses: dtolnay/rust-toolchain@stable
      - name: Show the pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      # aws-lc-rs (a fuigo-shell dependency) builds C with cmake.
      - name: Assert cmake
        shell: bash
        run: |
          command -v cmake || {
            echo "::error::cmake missing on ${{ matrix.runner }} -- the image changed; add an install step"; exit 1; }
          cmake --version | head -1
      # fuigo-tools-api's build.rs needs protoc; same pin and digest as release.yml.
      - name: Install protoc 29.3
        shell: bash
        run: |
          set -euo pipefail
          V=29.3
          sha=57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383
          curl -fsSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v$V/protoc-$V-win64.zip"
          echo "$sha  protoc.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/protoc"
          powershell -NoProfile -Command \
            "Expand-Archive -Path protoc.zip -DestinationPath '$RUNNER_TEMP/protoc' -Force"
          rm -f protoc.zip
          echo "PROTOC=$(cygpath -w "$RUNNER_TEMP/protoc/bin/protoc.exe")" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc.exe" --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-process-check-${{ matrix.runner }}
          cache-on-failure: true
      # The whole tty-utils lib suite: attached-child termination, the
      # parent-death watcher (early-fire guard, hook, hung-hook bound) and the
      # creation-flag values.
      - name: fuigo-tty-utils lib suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p process-receipts
          cargo test --locked -p fuigo-tty-utils --lib 2>&1 | tee process-receipts/tty-utils.log
          # A non-zero count: `[0-9]+ passed` also matches `0 passed; 0 failed`,
          # so a filter, harness or feature change that ran no test at all would
          # keep this gate green and lose the Windows-only coverage invisibly.
          grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed' process-receipts/tty-utils.log
          # …and the Windows-only tests themselves, pinned by name: a count alone
          # cannot tell that the cfg(windows) ones were compiled in and run.
          grep -F 'tests::arming_refuses_a_parent_that_exited_before_the_arm_on_windows ... ok' process-receipts/tty-utils.log
          grep -F 'tests::current_process_dies_when_its_parent_exits_on_windows ... ok' process-receipts/tty-utils.log
          grep -F 'tests::parent_death_hook_runs_before_termination_on_windows ... ok' process-receipts/tty-utils.log
          grep -F 'tests::a_disabled_parent_death_watch_leaves_the_process_alive_on_windows ... ok' process-receipts/tty-utils.log
          grep -F 'tests::a_hung_parent_death_hook_cannot_block_termination_on_windows ... ok' process-receipts/tty-utils.log
          grep -F 'tests::win32_creation_flag_values_match_the_windows_crate ... ok' process-receipts/tty-utils.log
      # The leader spawn tests (creation flags, and a probe spawned through the
      # real leader spawn path that must get its own windowless console), the
      # named-pipe transport tests, and the pin on the `agent stdio` entrypoint
      # line that arms the parent-death watcher — the line this workflow's
      # `agent/app.rs` path filter exists for.
      - name: fuigo-shell leader spawn, transport and parent-death arm tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p process-receipts
          cargo test --locked -p fuigo-shell --lib -- leader::tests::leader_spawn leader::transport:: agent::app::tests::the_stdio_agent_entrypoint_arms 2>&1 | tee process-receipts/fuigo-shell-leader.log
          grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed' process-receipts/fuigo-shell-leader.log
          grep -F 'leader::tests::leader_spawn_gets_its_own_windowless_console ... ok' process-receipts/fuigo-shell-leader.log
          grep -F 'leader::tests::leader_spawn_flags_match_the_windows_crate ... ok' process-receipts/fuigo-shell-leader.log
          grep -F 'agent::app::tests::the_stdio_agent_entrypoint_arms_the_parent_death_binding ... ok' process-receipts/fuigo-shell-leader.log
      # The FluxRouter cache opt-out, proved on Windows. Added at release-branch
      # level for 1.0.18: it belongs to no cluster, and until now the ONLY run of
      # this file was the release gate in release.yml, i.e. after the tag. The
      # customer incident this release fixes is a cache REPLAY, and cluster D's
      # opt-out is Fuigo's half of it, so a PR that breaks the bypass should go red
      # before the tag, not after.
      - name: fuigo-sampler FluxRouter cache-bypass integration test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p process-receipts
          # fluxrouter cache bypass gate: pull-request and push, on Windows. The release-time
          # proof stays in release.yml; this is the PR-level call site its comment anticipated.
          # --test-threads=1 is required: the file mutates process environment per call site.
          cargo test --locked -p fuigo-sampler --test fluxrouter_cache_bypass -- --test-threads=1 2>&1 | tee process-receipts/fluxrouter-cache-bypass.log
          # A non-zero count, for the same reason as the suites above: `[0-9]+ passed`
          # also matches `0 passed`, so a filter or feature change that ran nothing
          # would keep this gate green.
          grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed' process-receipts/fluxrouter-cache-bypass.log
          grep -F 'ci_runs_this_integration_test_and_every_call_site_names_its_gate ... ok' process-receipts/fluxrouter-cache-bypass.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-${{ matrix.runner }}
          path: process-receipts/
