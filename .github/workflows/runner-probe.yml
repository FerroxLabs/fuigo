name: runner-probe

# Throwaway. Answers cheap scheduling/toolchain questions in ~30s instead of
# after a 2-hour release build. Delete once the answers are recorded.
#
# Round 1 answered: ubuntu-24.04, ubuntu-24.04-arm, windows-latest,
# windows-11-arm and macos-14 all schedule, all have cmake. macos-13 queued
# indefinitely -- the Intel image looks retired for this account.
#
# Round 2 asks the follow-up: can macos-14 (arm64) stand in for it? That needs
# (a) an x86_64 cross-build to link, and (b) Rosetta to smoke-test the result.
on:
  workflow_dispatch:

jobs:
  darwin-x64-on-arm:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # NOT dtolnay/rust-toolchain@stable with `targets:`. rust-toolchain.toml
      # pins 1.94.0, so cargo inside the repo uses 1.94.0 no matter what that
      # action installed -- round 2a added the target to `stable` and then
      # failed with "can't find crate for `core`" against 1.94.0.
      # `rustup target add` run from inside the repo targets the pinned
      # toolchain, which is the one that actually builds.
      - name: Add target to the PINNED toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-apple-darwin
          rustup target list --installed

      - name: Can this runner execute x86_64?
        run: |
          echo "arch:    $(uname -m)"
          echo "rosetta: $(ls /Library/Apple/usr/libexec/oah 2>/dev/null && echo present || echo MISSING)"
          # The real question, not the proxy for it.
          arch -x86_64 /usr/bin/true && echo "exec-x86_64: YES" || echo "exec-x86_64: NO"

      # aws-lc-rs is the crate that decides whether this fallback is viable:
      # it builds C through cmake and is the usual reason a macOS cross-build
      # fails at link time. Build just it -- 2 minutes, not 90.
      - name: Cross-build the C-heavy dependency
        run: cargo build --release --target x86_64-apple-darwin -p aws-lc-rs

      - name: What did it produce?
        run: |
          find target/x86_64-apple-darwin/release -name 'libaws_lc_*.rlib' -o -name '*.a' | head -5
