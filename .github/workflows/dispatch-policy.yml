name: checked HTTP dispatch
on:
  push:
    branches: [main, release/audit-1.0.6]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (action default toolchain: stable)
      - name: Prepare pinned tools
        shell: bash
        run: |
          set -euo pipefail
          rustup component add clippy
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 300 https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: checked-dispatch
          cache-on-failure: true
      - name: Prove dispatch lint controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dispatch-receipts
          cargo clippy --locked -p fuigo-extra-ca --example dispatch_lint_control --no-deps -- -D clippy::disallowed_methods
          if cargo clippy --locked -p fuigo-extra-ca --example dispatch_lint_control --no-deps -- --cfg f06_raw_dispatch -D clippy::disallowed_methods >dispatch-receipts/negative.log 2>&1; then
            echo 'Unchecked dispatch unexpectedly compiled'; exit 1
          fi
          for method in 'reqwest::RequestBuilder::send' 'reqwest::Client::execute' 'reqwest::blocking::RequestBuilder::send' 'reqwest::blocking::Client::execute'; do
            grep -F "error: use of a disallowed method \`$method\`" dispatch-receipts/negative.log
          done
      - name: Prove session-writer enforcement (design F5 §9.3)
        shell: bash
        run: |
          set -euo pipefail
          # Checks 2 and 3 (no build): crate set and per-crate clippy.toml superset; raw-path scan against the baseline.
          scripts/ci/session-writer-crates.sh 2>&1 | tee dispatch-receipts/session-writer-crates.log
          # The six negative controls: five clippy fixtures and one scan fixture, each must fail with its diagnostic.
          scripts/ci/session-writer-controls.sh dispatch-receipts 2>&1 | tee dispatch-receipts/session-writer-controls.log
      - name: Prove the at-rest path inventory (1.0.47 S2, design §3 E2)
        shell: bash
        run: |
          set -euo pipefail
          # Negative controls first (design test 10): each must fail the check, the clean fixture must pass.
          python3 scripts/ci/at-rest-roots.py --selftest 2>&1 | tee dispatch-receipts/at-rest-controls.log
          # Every root-producer call classified, no hand-built root path, no raw write beside a classified site.
          python3 scripts/ci/at-rest-roots.py 2>&1 | tee dispatch-receipts/at-rest-roots.log
          # The generated schema-word list (value floor, Astra r2 A#10) matches the tree.
          python3 scripts/ci/at-rest-schema-words.py --check 2>&1 | tee dispatch-receipts/at-rest-schema-words.log
      - name: Check shipping libraries and binaries
        shell: bash
        run: |
          set -euo pipefail
          # Also check 1 of design F5 §5.4.3: the session-path producer ban (root clippy.toml) in every unlisted crate and
          # the raw-write ban in the five crates of session-writer-crates.toml (their own clippy.toml).
          cargo clippy --locked --workspace --lib --bins --no-deps -- -D clippy::disallowed_methods 2>&1 | tee dispatch-receipts/shipping.log
      - name: Confirm dispatch and PTY compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fuigo-extra-ca -p ptyctl-cli -- --test-threads=1 2>&1 | tee dispatch-receipts/compatibility.log
      - name: Confirm vendored terminal readiness
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crossterm --lib -- --test-threads=1 2>&1 | tee dispatch-receipts/crossterm.log
      - name: Confirm GCS auth and metadata transport
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p gcloud-auth -p gcloud-metadata --lib -- --test-threads=1 2>&1 | tee dispatch-receipts/gcs-auth.log
          cargo test --locked -p fuigo-file-utils --lib gcs_ -- --test-threads=1 2>&1 | tee dispatch-receipts/gcs-storage.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dispatch-policy-receipts
          path: dispatch-receipts/
          if-no-files-found: error
