name: lint
# Formatting and dependency policy. Both are cheap (no workspace build) and run on every change.
# fmt: the whole workspace is rustfmt-clean on the pinned toolchain; keep it that way.
# deny: advisories, bans and sources from deny.toml. Licenses are checked by the private release gate
# (scripts/strike/final-gate.sh runs the full `cargo deny check`).
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (action default toolchain: stable)
      # rust-toolchain.toml pins the channel; rustup honours it for cargo run inside the repo.
      - name: Install rustfmt for the pinned toolchain
        run: rustup component add rustfmt
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources
