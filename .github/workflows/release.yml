name: release

# Build all six platform binaries and publish the seven npm packages.
#
# WHY NATIVE RUNNERS FOR EVERY TARGET
# The obvious design is two runners cross-compiling to six triples. Do not.
# rustls pins `aws-lc-rs` (Cargo.toml), which builds C and needs cmake plus a
# working cross toolchain for the host->target pair. Cross-compiling it is
# solvable but it is a maintenance tax paid on every toolchain bump, and it
# fails at link time in CI rather than on a developer's machine.
#
# GitHub offers ARM runners for both Linux and Windows, so five of the six
# targets build natively and no cross toolchain exists to break. The sixth,
# darwin-x64, cross-compiles on macos-14 because the Intel image is gone --
# see the matrix comment. Runner availability is tabulated at the bottom.
#
#   Actions -> release -> Run workflow      (dry_run defaults to true)
#   git tag v1.0.1 && git push --tags       (publishes for real)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and assemble, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A release build of ~986 crates is long. Thin LTO and one codegen unit are
  # already set by the profile; this only trims incremental-compilation state
  # that a clean CI runner cannot use anyway.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.npm_platform }}
    runs-on: ${{ matrix.runner }}
    # The workspace is large; a cold cache genuinely takes this long.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            npm_platform: darwin-arm64
            bin: fuigo-pager
          # NOT macos-13. The Intel image no longer schedules for this
          # account -- probed 2026-09-01, the job sat queued for 30+ minutes
          # while every other label started within 5. An unavailable label
          # does not error, it queues forever, so this would have hung the
          # matrix rather than failed it.
          #
          # macos-14 (arm64) covers it instead. Probed on the same day:
          # aws-lc-sys cross-compiles its C for x86_64 in 46s and emits
          # libaws_lc_0_39_1_crypto.a, and Rosetta 2 is installed on the image
          # (`arch -x86_64` runs), so the smoke test below still executes the
          # binary it just built. Nothing about this target ships untested.
          - runner: macos-14
            target: x86_64-apple-darwin
            npm_platform: darwin-x64
            bin: fuigo-pager
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            npm_platform: linux-x64
            bin: fuigo-pager
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            npm_platform: linux-arm64
            bin: fuigo-pager
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            npm_platform: win32-x64
            bin: fuigo-pager.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            npm_platform: win32-arm64
            bin: fuigo-pager.exe

    steps:
      - uses: actions/checkout@v4

      # Present only to guarantee rustup exists on every image; windows-11-arm
      # is new enough that its preinstalled tooling is not worth assuming.
      # Deliberately no `targets:` input -- see the next step for why.
      - uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml pins channel 1.94.0, and rustup honours that file
      # for any cargo invoked inside the repo. So installing a target into
      # `stable` -- which is what the action's `targets:` input does -- achieves
      # nothing: cargo still runs 1.94.0, which does not have it. Not
      # hypothetical; doing exactly that failed a probe with
      #
      #   error[E0463]: can't find crate for `core`
      #   note: the `x86_64-apple-darwin` target may not be installed
      #
      # `rustup target add` run from inside the checkout resolves through
      # rust-toolchain.toml and installs into the toolchain that actually
      # builds. `rustup show` is printed so the log proves which one that was.
      - name: Add target to the pinned toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
          rustup target list --installed

      # aws-lc-rs builds C, so cmake must exist. Probed 2026-09-01: present on
      # every runner in this matrix (/usr/local/bin on Ubuntu, /opt/homebrew
      # on macOS, C:\Program Files\CMake on Windows).
      #
      # This asserts rather than installs. `apt-get update` is a live network
      # fetch from a mirror and a routine source of CI flakes, and installing
      # would only add /usr/bin/cmake behind the image's newer /usr/local/bin
      # copy on PATH -- a slower build with the same outcome. If a future image
      # drops cmake, this fails in seconds with a legible message instead of
      # 40 minutes later inside aws-lc-sys's build script.
      - name: Assert cmake
        shell: bash
        run: |
          command -v cmake || {
            echo "::error::cmake missing on ${{ matrix.runner }} -- the image changed; add an install step"; exit 1; }
          cmake --version | head -1

      # protoc is a BUILD-TIME dependency and it is on none of the runners.
      # fuigo-tools-api's build.rs calls fuigo_proto_build, which compiles
      # proto/fuigo-tools.proto. Without protoc the whole matrix dies ~3
      # minutes in with "failed to run custom build command for
      # fuigo-tools-api" -- observed on macos-14 and ubuntu-24.04-arm alike.
      #
      # The repo does vendor `bin/protoc`, but that is a dotslash stub: it
      # needs the `dotslash` launcher (absent here), and its platform table
      # covers only macos-aarch64, linux-x86_64 and linux-aarch64 -- there is
      # no Windows entry at all, so installing dotslash would still leave two
      # targets broken. find_protoc() checks $PROTOC first, so this pins the
      # same version the stub does (29.3) and points $PROTOC at it directly.
      #
      # The three unix digests are lifted from bin/protoc's own dotslash table,
      # so CI installs byte-for-byte what local dev runs. The win64 digest was
      # computed from the pinned release asset, which the stub does not cover.
      - name: Install protoc 29.3
        shell: bash
        run: |
          set -euo pipefail
          V=29.3
          host="$(uname -s)-$(uname -m)"
          case "$host" in
            Darwin-arm64)   asset=osx-aarch_64   sha=2b8a3403cd097f95f3ba656e14b76c732b6b26d7f183330b11e36ef2bc028765 ;;
            Linux-x86_64)   asset=linux-x86_64   sha=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a ;;
            Linux-aarch64)  asset=linux-aarch_64 sha=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32 ;;
            # git-bash reports x86_64 even on windows-11-arm, and win64 is the
            # right asset for both Windows runners regardless: Windows-on-ARM
            # runs x64 binaries, and protoc only has to run on the host.
            MINGW*|MSYS*)   asset=win64          sha=57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383 ;;
            *) echo "::error::no protoc mapping for host $host"; exit 1 ;;
          esac

          url="https://github.com/protocolbuffers/protobuf/releases/download/v$V/protoc-$V-$asset.zip"
          echo "host=$host -> $url"
          curl -fsSL -o protoc.zip "$url"

          # An unverified download that lands on PATH for a release build is a
          # supply-chain hole; fail rather than trust the CDN.
          if command -v sha256sum >/dev/null; then
            echo "$sha  protoc.zip" | sha256sum -c -
          else
            echo "$sha  protoc.zip" | shasum -a 256 -c -
          fi

          mkdir -p "$RUNNER_TEMP/protoc"
          if command -v unzip >/dev/null; then
            unzip -q protoc.zip -d "$RUNNER_TEMP/protoc"
          else
            # Git-for-Windows does not ship unzip; the image always has PowerShell.
            powershell -NoProfile -Command \
              "Expand-Archive -Path protoc.zip -DestinationPath '$RUNNER_TEMP/protoc' -Force"
          fi
          rm -f protoc.zip

          case "$host" in
            MINGW*|MSYS*)
              # Rust's Command::new cannot use an MSYS path like /d/a/_temp/...
              echo "PROTOC=$(cygpath -w "$RUNNER_TEMP/protoc/bin/protoc.exe")" >> "$GITHUB_ENV"
              "$RUNNER_TEMP/protoc/bin/protoc.exe" --version ;;
            *)
              chmod +x "$RUNNER_TEMP/protoc/bin/protoc"
              echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
              "$RUNNER_TEMP/protoc/bin/protoc" --version ;;
          esac

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Cache the release profile; the default only covers debug.
          cache-targets: true
          cache-on-failure: true

      # FUIGO_VERSION marks the binary as a release build. Without it
      # `fuigo_version::IS_DEV_BUILD` is true and the folder-trust gate
      # (`folder_trust_inert()`) treats every clone as trusted, so repo-local
      # MCP/LSP/hooks/permission policy, project instructions and project
      # skills load ungated. 1.0.11 and 1.0.12 shipped unstamped. The value is
      # the same one the smoke test below expects in `--version`.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          FUIGO_VERSION=$(grep -m1 '^version' crates/codegen/fuigo-version/Cargo.toml | cut -d'"' -f2)
          export FUIGO_VERSION
          cargo build --release --target ${{ matrix.target }} -p fuigo-pager-bin

      # A binary that cannot start is worth catching here rather than after
      # publish. Only meaningful where the runner can execute what it built,
      # which with native runners is every target.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          ACTUAL=$("$BIN" --version | tr -d '\r')
          EXPECTED=$(grep -m1 '^version' crates/codegen/fuigo-version/Cargo.toml | cut -d'"' -f2)
          COMMIT=$(git rev-parse HEAD)
          COMMIT=${COMMIT:0:12}
          echo "$ACTUAL"
          [ "$ACTUAL" = "fuigo $EXPECTED ($COMMIT)" ] || {
            echo "::error::binary identity mismatch: expected fuigo $EXPECTED ($COMMIT)"; exit 1; }


      # Two separate checks, because the signing rule is per-architecture and
      # both darwin jobs now share one runner.
      #
      # SIGNATURE. arm64 requires a signature to execute at all and the linker
      # applies an ad-hoc one; an invalidated signature is SIGKILL with no
      # diagnostic on the user's machine, so it is verified. x86_64 gets no
      # such signature -- ld does not apply one, and none is required.
      # Confirmed both ways on a local arm64 mac: the native arm64 link is
      # "valid on disk", the x86_64 link is "code object is not signed at all
      # / In architecture: x86_64", and the unsigned x86_64 binary runs. A
      # native macos-13 build would have been identical. Architectural, not a
      # consequence of cross-compiling, so x86_64 is exempt rather than fixed.
      #
      # ARCHITECTURE. This is the check that actually earns its place. Both
      # darwin targets build on the same arm64 runner, so if `--target` were
      # ever dropped, darwin-x64 would silently ship an arm64 binary -- and the
      # smoke test could not catch it, because an arm64 binary runs perfectly
      # on an arm64 host. Users on Intel macs would get the failure instead.
      - name: Verify macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          archs=$(lipo -archs "$BIN")
          echo "architectures: $archs"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              [ "$archs" = "arm64" ] || {
                echo "::error::expected arm64, built $archs"; exit 1; }
              codesign --verify --verbose=1 "$BIN"
              ;;
            x86_64-apple-darwin)
              [ "$archs" = "x86_64" ] || {
                echo "::error::expected x86_64, built $archs -- did --target get dropped?"; exit 1; }
              echo "x86_64 carries no ad-hoc signature by design; codesign --verify not applicable"
              ;;
            *) echo "::error::unhandled macOS target ${{ matrix.target }}"; exit 1 ;;
          esac

      - name: Verify release memory finalization
        if: matrix.npm_platform == 'darwin-arm64'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          python3 scripts/memory-bench/native_smoke.py --binary "$BIN" --force-recall-loop --out "$RUNNER_TEMP/memory-final"
          python3 scripts/memory-bench/native_smoke.py --binary "$BIN" --force-recall-loop --hostile-final-tool --out "$RUNNER_TEMP/memory-hostile"
          python3 scripts/memory-bench/native_smoke.py --binary "$BIN" --force-recall-loop --general-tools --out "$RUNNER_TEMP/memory-general"

      - name: Preserve memory smoke evidence
        if: always() && matrix.npm_platform == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: memory-smoke-evidence
          path: |
            ${{ runner.temp }}/memory-final
            ${{ runner.temp }}/memory-hostile
            ${{ runner.temp }}/memory-general
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: fuigo-${{ matrix.npm_platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          retention-days: 3
          # Already ~166 MB; the assemble step brotli-compresses it properly.
          compression-level: 0
          if-no-files-found: error

  security:
    name: security and recovery regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUST_MIN_STACK: "16777216"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      CARGO_TARGET_DIR: target/security-checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned test tools
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cmake --version | head -1
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          df -h .
      - name: Run required regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fuigo-extra-ca -p fuigo-shell-base -p fuigo-update -p fuigo-workflow -p fuigo-secrets -p fuigo-telemetry --lib -- --test-threads=1
          cargo test --locked -p fuigo-shell -p fuigo-tools -p fuigo-mcp -p fuigo-hooks --lib t05_ -- --test-threads=1
          cargo test --locked -p fuigo-shell -p fuigo-tools --lib t04_ -- --test-threads=1
          cargo test --locked -p fuigo-sampler --lib actor::request_task::tests -- --test-threads=1
          cargo test --locked -p fuigo-memory -p fuigo-config-types --lib -- --test-threads=1
          cargo test --locked -p fuigo-sampler --lib execution_budget -- --test-threads=1
          cargo test --locked -p fuigo-shell --lib recall_finalization_tests -- --test-threads=1
          cargo test --locked -p fuigo-shell --lib settled_recall_can_complete -- --test-threads=1
          python3 -m unittest discover -s scripts/memory-bench -p test_stream_parser.py

  publish:
    name: assemble and publish
    needs: [build, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: read
      # No id-token permission, because nothing below asks npm for a
      # provenance attestation. npm stopped accepting those from private
      # source repositories on 2023-07-25, and FerroxLabs/fuigo is private --
      # so requesting one would fail the publish AFTER a two-hour matrix had
      # already succeeded. If the repo is ever made public, restore
      # `id-token: write` here and the flag on both publish commands.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: fuigo-*

      - name: Show what arrived
        run: |
          find artifacts -type f -exec ls -lh {} \;
          test $(find artifacts -type f | wc -l) -eq 6 || {
            echo "::error::expected 6 binaries, refusing to publish a partial set"; exit 1; }

      # Deliberately NO `npm install` here.
      #
      # The meta package lists its six platform packages as
      # optionalDependencies pinned to the version being released -- which does
      # not exist in the registry until the step below publishes it. Installing
      # first is a chicken-and-egg that fails on every FIRST publish of a
      # version.
      #
      # It is also unnecessary: sync-version.js and
      # assemble-platform-packages.js use only Node builtins (fs, path, zlib,
      # child_process). The single runtime dependency, @iarna/toml, is used by
      # bin/postinstall.js, which runs on the USER's machine at install time.

      # Fails if any npm version disagrees with fuigo-version/Cargo.toml.
      - name: Check versions
        working-directory: crates/codegen/fuigo-pager/npm/fuigo
        run: |
          node scripts/test-postinstall.js
          npm run check-version

      - name: Assemble platform packages
        working-directory: crates/codegen/fuigo-pager/npm/fuigo
        env:
          # brotli runs on the libuv pool (default 4), so without this two of
          # the six compressions serialise.
          UV_THREADPOOL_SIZE: 6
          FUIGO_DARWIN_ARM64: ${{ github.workspace }}/artifacts/fuigo-darwin-arm64/fuigo-pager
          FUIGO_DARWIN_X64: ${{ github.workspace }}/artifacts/fuigo-darwin-x64/fuigo-pager
          FUIGO_LINUX_ARM64: ${{ github.workspace }}/artifacts/fuigo-linux-arm64/fuigo-pager
          FUIGO_LINUX_X64: ${{ github.workspace }}/artifacts/fuigo-linux-x64/fuigo-pager
          FUIGO_WIN32_ARM64: ${{ github.workspace }}/artifacts/fuigo-win32-arm64/fuigo-pager.exe
          FUIGO_WIN32_X64: ${{ github.workspace }}/artifacts/fuigo-win32-x64/fuigo-pager.exe
        run: npm run assemble

      - name: Resolve version
        id: v
        # A tag name is attacker-influenceable by anyone who can push a tag, so
        # it reaches the shell through env rather than ${{ }} interpolation --
        # interpolation would splice it into the script text itself.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V=$(grep -m1 '^version' crates/codegen/fuigo-version/Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing $V"
          # On a tag push, the tag must agree with the source of truth.
          if [ "$REF_TYPE" = "tag" ]; then
            [ "$REF_NAME" = "v$V" ] || {
              echo "::error::tag $REF_NAME does not match version $V"; exit 1; }
          fi

      - name: Verify release archives
        working-directory: crates/codegen/fuigo-pager/npm/fuigo
        run: node scripts/verify-package-archives.js "$RUNNER_TEMP/fuigo-release-packages"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ steps.v.outputs.version }}
          path: ${{ runner.temp }}/fuigo-release-packages/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      # ORDER IS LOAD-BEARING. The meta package pins its six
      # optionalDependencies to an EXACT version, so publishing it first leaves
      # a window in which `npm i fuigo` resolves nothing
      # installable. Platform packages first, meta last.
      # RESUMABLE ON PURPOSE. npm refuses to republish an existing version, so
      # a plain loop cannot be retried after a partial publish -- it dies on
      # the first already-published package and never reaches the ones that
      # still need it. That is not hypothetical: v1.0.1 published four of six
      # and then tripped npm's spam detection on the fifth, leaving a state no
      # naive re-run could recover.
      #
      # The burst theory that first justified the sleep was WRONG, and the
      # correction is worth keeping: npm's filter is name-based, not rate-based.
      # Publishing `fuigo-win32-arm64` ALONE, ten minutes after a successful
      # sibling publish from the same account, fails identically. The token
      # `win32-arm64` in an unscoped name is what it refuses -- which is why
      # that one platform publishes as `fuigo-windows-arm64` (see the case
      # statement below and bin/postinstall.js). The sleep stays because it is
      # cheap, not because it was ever the fix.
      #
      # The loop no longer aborts on the first failure. When the 403 hit
      # win32-arm64 at v1.0.2 it killed the step before win32-x64 was ever
      # attempted, so ONE refused name cost TWO missing packages and the
      # release had to be finished by hand.
      - name: Publish platform packages
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: crates/codegen/fuigo-pager/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -uo pipefail
          failed=""
          first=1
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            # The DIRECTORY is always fuigo-<platform>; the published NAME is scoped.
            dir="fuigo-$p"
            name="@fuigo/$p"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "--- $name@$VERSION already published, skipping"
              continue
            fi
            [ "$first" = 1 ] || sleep 20
            first=0
            echo "--- publishing $name@$VERSION (from $dir)"
            if ! (cd "$dir" && npm publish --access public); then
              echo "::error::failed to publish $name@$VERSION"
              failed="$failed $name"
            fi
          done
          # Fail AFTER trying all six, so one refused name cannot hide the rest.
          # The meta package step is skipped by this failure on purpose: its
          # optionalDependencies pin exact versions, so it must not ship while
          # any platform package is missing.
          if [ -n "$failed" ]; then
            echo "::error::platform packages failed to publish:$failed"
            exit 1
          fi

      # WAIT FOR THE SIX TO BE RESOLVABLE BEFORE SHIPPING THE META PACKAGE.
      # `npm publish` printing `+ name@version` does NOT mean the package is in
      # the registry: a scoped first publish to a new org went to npm's Staged
      # Packages and returned 404 to both anonymous and authenticated GETs for
      # the better part of an hour. The meta package pins exact versions, so
      # publishing it against names that do not resolve yet is the same broken
      # install we just spent a release fixing. Poll until every one answers.
      - name: Wait until every platform package resolves
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -uo pipefail
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            name="@fuigo/$p"
            ok=0
            for attempt in $(seq 1 60); do
              if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                echo "--- $name@$VERSION resolves"; ok=1; break
              fi
              sleep 10
            done
            if [ "$ok" = 0 ]; then
              echo "::error::$name@$VERSION did not become resolvable within 10 minutes."
              echo "::error::It may be sitting in npm Staged Packages awaiting promotion."
              exit 1
            fi
          done

      # Guarded the same way, so a re-run after a partial publish is safe.
      # This one must not go early: its optionalDependencies pin exact
      # versions, so publishing it before all six platform packages exist
      # leaves `npm i fuigo` resolving nothing installable.
      - name: Publish meta package
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: crates/codegen/fuigo-pager/npm/fuigo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "fuigo@$VERSION" version >/dev/null 2>&1; then
            echo "fuigo@$VERSION already published, nothing to do"
            exit 0
          fi
          npm publish --access public

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: crates/codegen/fuigo-pager/npm
        run: |
          echo "DRY RUN — nothing published."
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64 ""; do
            d="fuigo${p:+-$p}"; [ -d "$d" ] || continue
            (cd "$d" && npm pack --dry-run 2>&1 | tail -6)
          done

  verify-published:
    name: verify npm ${{ matrix.platform }}
    needs: publish
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, platform: darwin-arm64 }
          - { runner: macos-14, platform: darwin-x64 }
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: windows-latest, platform: win32-x64 }
          - { runner: windows-11-arm, platform: win32-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify registry package and native execution
        shell: bash
        run: node crates/codegen/fuigo-pager/npm/fuigo/scripts/verify-published-platform.js '${{ matrix.platform }}'

# RUNNER AVAILABILITY, probed 2026-09-01 against this repo
#
#   ubuntu-24.04      schedules    cmake /usr/local/bin
#   ubuntu-24.04-arm  schedules    cmake /usr/local/bin
#   windows-latest    schedules    cmake C:\Program Files\CMake
#   windows-11-arm    schedules    cmake C:\Program Files\CMake
#   macos-14          schedules    cmake /opt/homebrew, Rosetta 2 present
#   macos-13          QUEUES FOREVER -- treat the Intel image as gone
#
# FALLBACKS
#
# If `ubuntu-24.04-arm` / `windows-11-arm` stop being available to you:
#
#   linux-arm64   — use `cross` (Docker-based, brings its own sysroot):
#                     cargo install cross
#                     cross build --release --target aarch64-unknown-linux-gnu \
#                       -p fuigo-pager-bin
#                   Drop the smoke-test step for that target: the runner cannot
#                   execute an aarch64 binary.
#
#   win32-arm64   — add the rustup target on windows-latest and cross-link:
#                     rustup target add aarch64-pc-windows-msvc
#                   aws-lc-rs needs the ARM64 MSVC toolchain component
#                   (Microsoft.VisualStudio.Component.VC.Tools.ARM64) which is
#                   NOT on the default image; install it with the VS installer
#                   step or expect a link failure in aws-lc-sys.
#
# Either fallback means shipping a binary nobody executed before publish. Prefer
# the native runners.
#
# darwin-x64 is already the exception: it cross-compiles on macos-14 because
# macos-13 is gone. That one is safe to accept only because Rosetta 2 lets the
# arm64 runner execute the x86_64 result, so the smoke test is real. Do not
# extend the same reasoning to a target with no such escape hatch.
