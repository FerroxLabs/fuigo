[package]
license = "Apache-2.0"
name = "fuigo-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for Ferrox Labs agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
fuigo-compaction-transcript = { workspace = true }
fuigo-compaction = { path = "../../common/fuigo-compaction" }
fuigo-sampling-types = { path = "../fuigo-sampling-types" }
fuigo-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
