[package]
license = "Apache-2.0"
name = "fuigo-test-support"
version = "0.1.0"
edition.workspace = true
description = "Shared test-support for fuigo-build crates: mock inference server, SSE generators, ACP stdio client, headless runner, env sandbox"
publish = false

[dependencies]
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# `test-util`: `loopback` probes each candidate address on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
url = { workspace = true }
# Trusted-HTTPS front for session-auth tests (`session_front`): a throwaway CA and a TLS acceptor.
rcgen = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
fuigo-acp-lib = { workspace = true }
fuigo-tty-utils = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
[features]
default = []
default-bazel = []

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
