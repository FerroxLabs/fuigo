[package]
license = "Apache-2.0"
name = "fuigo-hunk-tracker"
version = "0.1.0"
edition.workspace = true
description = "Track file hunks (diffs) with agent/external attribution"

[dependencies]
# S2: writes under the session/log roots go through the at-rest layer.
fuigo-secrets = { workspace = true }
# External
chrono = { workspace = true, features = ["serde"] }
dunce = { workspace = true }
rustc-hash = { workspace = true }
gix = { workspace = true, features = ["status", "index", "parallel"] }
serde = { workspace = true, features = ["derive", "rc"] }
fuigo-gix-status = { workspace = true }
fuigo-tty-utils = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
fuigo-test-utils = { workspace = true }
fuigo-tty-utils = { workspace = true, features = ["unjudged-repo-exec"] }

[lints]
workspace = true
