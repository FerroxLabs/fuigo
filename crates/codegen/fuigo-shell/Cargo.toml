[package]
license = "Apache-2.0"
name = "fuigo-shell"
version = "1.0.1"
edition.workspace = true

[features]
default = []
dhat-heap = ["dep:dhat"]
# Loom model-checking for src/auth/manager/lock/flock_wait.rs; test-only
# (compile_error!-guarded). Run in release (debug overflows loom's stacks):
#   cargo test --release --features loom -p fuigo-shell --lib flock_wait::loom -- --test-threads=1
loom = ["dep:loom"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`.
test-support = []
test-util = []
# Local Computer Hub workspace_server (own/attach + crash-restart). Requires
local-workspace = []
# CI default set (preferred over cargo `default` for hermetic CI builds):
# `config-docs` is on this set (not cargo `default`) so hermetic lib tests
# parse the committed config-reference page.
config-docs = []
default-bazel = [
    "local-workspace",
    "test-support",
    "config-docs",
]

[dependencies]
dunce = { workspace = true }
tonic-prost = { workspace = true, optional = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
fuigo-announcements = { workspace = true }
fuigo-prompt-queue = { workspace = true }
fuigo-version = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
kanal = "0.1"
loom = { workspace = true, optional = true }
regex = { workspace = true }
# rmcp 2.1 + reqwest 0.13 are quarantined inside `fuigo-mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `fuigo_mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of fuigo-mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
fuigo-mcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
clap = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
obfstr = { workspace = true }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
fuigo-acp-lib = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
webbrowser = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
gcloud-storage = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = "0.15"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2 = { workspace = true }
rand = { workspace = true }
strum = { workspace = true }
fuigo-fast-worktree = { path = "../fuigo-fast-worktree", features = ["metadata"] }

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
fuigo-paths = { path = "../fuigo-paths" }
fuigo-shell-base = { workspace = true }
fuigo-shell-session-support = { workspace = true }
fuigo-shell-terminal = { workspace = true }
fuigo-shared = { workspace = true }
fuigo-status-line = { workspace = true }
fuigo-tracing-macros = { path = "../fuigo-tracing-macros" }
fuigo-fsnotify = { path = "../fuigo-fsnotify" }
fuigo-codebase-graph = { path = "../fuigo-codebase-graph" }
fuigo-hunk-tracker = { path = "../fuigo-hunk-tracker" }
fuigo-agent-lifecycle = { workspace = true }
fuigo-interjection-core = { workspace = true }
fuigo-message-delivery-core = { workspace = true }
fuigo-sandbox = { path = "../fuigo-sandbox", default-features = false }
fuigo-chat-state = { path = "../fuigo-chat-state" }
# Segment markdown rendering + the `compaction/` store path convention.
fuigo-compaction-transcript = { workspace = true }
fuigo-compaction = { path = "../../common/fuigo-compaction" }
fuigo-extra-ca = { workspace = true }
fuigo-sampler = { path = "../fuigo-sampler" }
# Session FTS search; owns this crate's only rusqlite/bundled-SQLite use.
fuigo-session-search = { workspace = true }
fuigo-token-estimation = { workspace = true }
fuigo-sampling-types = { path = "../fuigo-sampling-types" }
fuigo-tools = { path = "../fuigo-tools" }
fuigo-tty-utils = { workspace = true }
fuigo-workflow = { path = "../fuigo-workflow" }
fuigo-system-power = { workspace = true }
fuigo-workspace = { workspace = true }
# Backs the compatibility-only `fuigo_shell::foreign_sessions` re-export.
fuigo-foreign-sessions = { workspace = true }
fuigo-subagent-resolution = { path = "../fuigo-subagent-resolution" }
fuigo-agent = { path = "../fuigo-agent" }
fuigo-bundle = { workspace = true }
fuigo-config = { workspace = true }
fuigo-config-types = { workspace = true }
fuigo-dirs = { workspace = true }
fuigo-memory = { workspace = true }
fuigo-hooks = { path = "../fuigo-hooks" }
fuigo-hooks-plugins-types = { path = "../fuigo-hooks-plugins-types" }
fuigo-plugin-marketplace = { path = "../fuigo-plugin-marketplace" }
fuigo-file-utils = { path = "../fuigo-file-utils" }
fuigo-session-events = { workspace = true }
fuigo-auth = { workspace = true, features = ["middleware"] }
fuigo-telemetry = { workspace = true }
fuigo-http = { workspace = true }
fuigo-models = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
flate2 = { workspace = true }
fs2 = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
parking_lot.workspace = true
dashmap.workspace = true

# Used by acp_session.rs and mcp_servers.rs for the unified
# fuigo_tool_runtime::Tool dispatch model and the computer-hub MCP adapter.
fuigo-computer-hub-sdk = { workspace = true }
fuigo-tool-runtime = { workspace = true }
fuigo-tool-protocol = { workspace = true }
fuigo-tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
# The fixture that builds a `[ui.status_line]` section field by field.
fuigo-status-line = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = { workspace = true }
filetime = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# `extensions::bundle` tests build archives with `bundle::test_helpers`, which
# is `#[cfg(test)]`-only inside fuigo-bundle without this feature.
fuigo-bundle = { workspace = true, features = ["test-support"] }
fuigo-memory = { workspace = true, features = ["test-support"] }
# sandbox-enforce: keep tests running against the enforcing sandbox build.
fuigo-workspace = { workspace = true, features = ["test-support", "sandbox-enforce"] }
fuigo-config = { workspace = true, features = [] }
ring = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
rsa = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
fuigo-shell-base = { workspace = true, features = ["test-support"] }
fuigo-test-support = { workspace = true, features = [] }
fuigo-test-utils = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "fork_copy"
harness = false
required-features = ["test-support"]

[[bench]]
name = "skills_watcher_startup"
harness = false

[[bench]]
name = "child_replay_lookup"
harness = false

# Ordinary integration tests live in `tests/all.rs` (`mod suite`) so cargo
# links one binary. The test name is `fuigo-shell-all` (Bazel `//pkg:all`
# is the package wildcard). Process-isolated suites stay as implicit
# `tests/*.rs` binaries.
[[test]]
name = "test_startup_prefetch_fallback"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_overlap"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_policy"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_repair_skip"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_shared"
required-features = ["test-support"]

[lints]
workspace = true
[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }

[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"
