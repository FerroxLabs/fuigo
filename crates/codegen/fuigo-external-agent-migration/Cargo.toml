[package]
license = "Apache-2.0"
name = "fuigo-external-agent-migration"
version = "0.1.0"
edition.workspace = true
description = "Import another agent's settings into Fuigo config: permissions, hooks, MCP servers, environment variables, skill directories and rule directories. Planning and merging only; the caller reads the source settings and owns the (locked, owner-only) writes."

[dependencies]
dunce = { workspace = true }
fuigo-config-types = { workspace = true }
fuigo-dirs = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
