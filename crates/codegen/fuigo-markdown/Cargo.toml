[package]
license = "Apache-2.0"
name = "fuigo-markdown"
version = "0.1.0"
edition.workspace = true
authors = ["Ferrox Labs"]
description = "Streaming markdown renderer for terminal UIs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# The workspace's print deny (R077: release is panic = "abort", and a print to a dead stdout/stderr
# aborts). Spelled out here because this crate's own [lints.rust] rules out `workspace = true`.
[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dependencies]
anstyle = { workspace = true }
anstyle-lossy = { workspace = true }
anstyle-syntect = { workspace = true }
html-escape = { workspace = true }
linkify = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
supports-color = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
textwrap = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
fuigo-markdown-core = { workspace = true }

[dependencies.crossterm]
workspace = true
features = ["event-stream", "bracketed-paste"]
optional = true

[dependencies.fuigo-ratatui-textarea]
workspace = true
optional = true

[dev-dependencies]
criterion = { workspace = true }
pretty_assertions = { workspace = true }

[[bin]]
name = "md-table-test"
path = "bin/md_table_test.rs"
required-features = ["playground"]

[[bin]]
name = "md-mermaid-test"
path = "bin/md_mermaid_test.rs"
required-features = ["playground"]

[features]
default = []
playground = ["dep:crossterm", "dep:fuigo-ratatui-textarea"]

[[bench]]
name = "bench"
harness = false
