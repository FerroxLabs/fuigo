[package]
name = "fuigo-tty-utils"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Lightweight process-spawning utilities for TTY safety — detach from controlling terminal, suppress interactive pagers, process-group lifecycle"

[dependencies]
tokio = { workspace = true, features = ["process", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[features]
# Test-only introspection for crates that link this one and need to pin that
# their own production startup registered a parent-death hook
# (`registered_parent_death_hook`). Enabled as a dev-dependency only; never in
# a shipped build, so the accessor is not part of the supported surface.
testing = []

[lints]
workspace = true
