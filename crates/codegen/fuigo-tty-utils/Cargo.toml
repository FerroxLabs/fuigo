[package]
name = "fuigo-tty-utils"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Lightweight process-spawning utilities for TTY safety — detach from controlling terminal, suppress interactive pagers, process-group lifecycle"

[dependencies]
fuigo-secrets = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
fuigo-secrets = { workspace = true, features = ["test-support"] }

[features]
# Test-only introspection for crates that link this one and need to pin their
# own production startup: that it registered a parent-death hook
# (`registered_parent_death_hook`) and that it called
# `kill_current_process_on_parent_death` (`parent_death_arm_calls`). Enabled as
# a dev-dependency only; never in a shipped build, so neither accessor is part
# of the supported surface.
testing = []

[lints]
workspace = true
