[package]
license = "Apache-2.0"
name = "fuigo-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the fuigo CLI, extracted from fuigo-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
fuigo-announcements = { workspace = true }
fuigo-config = { workspace = true }
fuigo-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
