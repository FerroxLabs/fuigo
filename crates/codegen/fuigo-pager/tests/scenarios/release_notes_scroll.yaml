mock:
  response: "SCRIPTED_RELEASE_NOTES_SCROLL unused for this scenario."
steps:
  - action: wait_for_text
    text: Quit
    timeout_ms: 20000
  # Promote welcome → session and open release notes (reads the seeded cache).
  - action: type_text
    text: "/release-notes"
  - action: keys
    keys: "<Enter>"
  - action: wait_for_text
    text: Release Notes
    timeout_ms: 20000
  - action: assert_contains
    text: scroll
  # Keyboard scroll through the modal body.
  - action: keys
    keys: "<Down><Down><Down><Down><Down><Down><Down><Down><Down><Down>"
  - action: wait
    millis: 200
  - action: keys
    keys: "jjjjjjjjjj"
  - action: wait
    millis: 200
  # Mouse wheel at the center of the modal.
  - action: scroll
    row: 20
    col: 55
    direction: down
    count: 15
  - action: wait
    millis: 250
  - action: assert_contains
    text: Release Notes
  - action: assert_not_contains
    text: panicked
  - action: keys
    keys: "<Esc>"
  - action: screenshot
    name: release-notes-after-scroll
    note: Release notes modal after keyboard + wheel scroll.
