name: release-notes-scroll
description: >
  Open /release-notes (DocViewer modal) and verify keyboard + mouse-wheel scrolling
  moves the changelog body. Fuigo publishes no changelog CDN, so the scenario seeds
  the CHANGELOG.md cache that /release-notes reads (`environment.home_files`) and
  asserts the modal chrome + scroll affordances.
terminal:
  rows: 40
  cols: 110
environment:
  home_files:
    CHANGELOG.md: |
