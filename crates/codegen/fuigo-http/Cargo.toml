[package]
license = "Apache-2.0"
name = "fuigo-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the fuigo CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
fuigo-auth = { workspace = true, features = ["middleware"] }
fuigo-extra-ca = { workspace = true }
fuigo-sampler = { path = "../fuigo-sampler" }
fuigo-telemetry = { workspace = true }
fuigo-version = { workspace = true }
fuigo-workspace = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
