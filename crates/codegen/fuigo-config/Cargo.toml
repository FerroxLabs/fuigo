[package]
license = "Apache-2.0"
name = "fuigo-config"
version = "0.1.0"
edition.workspace = true
description = "Shared config loading for Fuigo — fuigo_home, effective config (requirements > user > managed), TOML merge"

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
dunce = { workspace = true }
# fs2: advisory cross-process flock for the config.toml write lock (fs_atomic).
fs2 = { workspace = true }
# Shared signed deployment-config envelope contract with the cli-chat-proxy signer.
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
ring = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = "3.1"
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
which = { workspace = true }
fuigo-dirs = { workspace = true }
fuigo-tty-utils = { workspace = true }
fuigo-version = { workspace = true }

# core-foundation: read macOS MDM managed preferences (`ai.x.grok`) for the
# admin-deployed requirements layer.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

# libc / windows: `write_through` carries xattrs/ACLs (Linux, macOS) and the
# DACL (Windows) onto a replaced file.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Fault-injection seams in `write_through`, for other crates' tests only
# (enabled from their [dev-dependencies]; resolver 2 keeps it out of builds).
test-seams = []

[lints]
workspace = true