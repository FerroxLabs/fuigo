[package]
license = "Apache-2.0"
name = "fuigo-hooks"
version = "0.1.0"
edition.workspace = true
description = "Runtime hook system for Fuigo — file-based discovery, command execution, and policy enforcement"

[dependencies]
fuigo-auth = { workspace = true }
fastrand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
fuigo-extra-ca = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shellexpand = "3.1"
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
fuigo-config = { workspace = true }
# P118: a key late-bound into a hook child is recorded for the sent-credential scrub.
fuigo-secrets = { workspace = true }
# Child-network restriction on hook command spawns; enforce is feature-unified
# from the binary crate, matching the other consumers.
fuigo-sandbox = { path = "../fuigo-sandbox", default-features = false }
fuigo-tools = { workspace = true }

[dev-dependencies]
# Fault seams for the P61 error-path tests of the disabled-hooks writer.
fuigo-config = { workspace = true, features = ["test-seams"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true