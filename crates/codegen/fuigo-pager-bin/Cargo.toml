[package]
name = "fuigo-pager-bin"
# NOT the version `fuigo --version` prints, and not what npm publishes. Both of
# those come from fuigo-version/Cargo.toml, which build.rs reads directly. This
# number exists because cargo requires one; it is kept in step only for tidiness,
# and nothing breaks if it drifts.
version = "1.0.4"
edition.workspace = true
license = "Apache-2.0"
authors = ["Ferrox Labs"]
default-run = "fuigo-pager"

# Composition-root binary for the Fuigo TUI. The artifact is still named
# `fuigo-pager`. This package exists so the binary can link both the pager
# library and the optional `fuigo-pager-minimal` render mode: `minimal`
# depends on `fuigo-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
[[bin]]
name = "fuigo-pager"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
fuigo-pager = { path = "../fuigo-pager" }
# Optional scrollback-native render mode, wired in via the fn-pointer seam.
fuigo-pager-minimal = { path = "../fuigo-pager-minimal" }

# Agent runtime + leader/stdio/headless entry points.
fuigo-shell = { workspace = true }
fuigo-update = { path = "../fuigo-update" }
fuigo-version = { workspace = true }
fuigo-telemetry = { workspace = true }
fuigo-workspace = { workspace = true }
fuigo-crash-handler = { path = "../fuigo-crash-handler" }
fuigo-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
fuigo-tty-utils = { workspace = true }
# `collect_crashed()` for the startup crash notice.
fuigo-active-sessions = { workspace = true }
fuigo-config = { workspace = true }
fuigo-sandbox = { path = "../fuigo-sandbox", default-features = false }
fuigo-extra-ca = { workspace = true }

# Binary hardening: compile-time string + control-flow obfuscation.
obfstr = { workspace = true }
cryptify = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = { workspace = true, optional = true }
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "local-workspace",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
# fuigo-workspace no longer enables sandbox-enforce by default, so enable it here.
sandbox-enforce = ["fuigo-pager/sandbox-enforce", "fuigo-workspace/sandbox-enforce"]
local-workspace = ["fuigo-pager/local-workspace"]
release-dist = [
    "fuigo-pager/release-dist",
    ]
