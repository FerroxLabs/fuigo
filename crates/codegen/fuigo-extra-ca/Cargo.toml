[package]
license = "Apache-2.0"
name = "fuigo-extra-ca"
version = "0.1.0"
edition.workspace = true
description = "TLS policy for the fuigo CLI: rustls backend pin, process crypto provider, shared root store, and opt-in FUIGO_EXTRA_CA_BUNDLE roots"

[dependencies]
# The adapters promise OS trust plus the Mozilla bundle, so an unreadable OS
# store degrades rather than fails; both features must travel with this crate.
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# Both providers stay explicit: ensure_default_crypto_provider picks one per target (ring on Windows ARM64) and unification would mask either's absence.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "ring", "std"] }
rustls-native-certs = { workspace = true }
# spawn_blocking, for the egress guard's delegate resolution.
tokio = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rcgen = { workspace = true }
# Carries the workspace rustls feature set into the test build; ring comes from the crate's own features above.
rustls = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
