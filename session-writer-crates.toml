# Session-writer crates (design F5 §5.4). Every crate listed here may write inside a session folder, and only through
# `fuigo_session_writer::SessionWriter` (the choke point). Each listed crate carries its own `clippy.toml`: a key-wise
# superset of the root `clippy.toml` (minus `producers` below) plus every path in `raw-write-ban`. Every other crate
# inherits the root `clippy.toml`, whose `disallowed-methods` ban the `producers`, so a crate that starts computing a
# session-folder path fails CI until it is listed here or allowed with a reason.
#
# Checked by `scripts/ci/session-writer-crates.sh` (dispatch-policy workflow).

crates = [
    "fuigo-session-writer",
    "fuigo-shell",
    "fuigo-tools",
    "fuigo-session-events",
    "fuigo-shell-terminal",
]

# Session-path producers (§5.4.3 check 1): banned in the root clippy.toml, omitted from the files of listed crates.
producers = [
    "fuigo_config::paths::sessions_cwd_dir",
    "fuigo_config::paths::sessions_cwd_dir_in",
    "fuigo_config::paths::ensure_sessions_cwd_dir",
    "fuigo_config::paths::ensure_sessions_cwd_dir_in",
    "fuigo_shared::session::session_dir",
    "fuigo_session_writer::SessionWriter::dir",
    "fuigo_shell::session::persistence::find_session_dir_by_id",
    "fuigo_shell::session::persistence::find_persisted_session_dir",
]

# Raw-mutation list and path-taking helpers by defining path (§5.4.1): banned in every listed crate.
raw-write-ban = [
    "std::fs::write",
    "std::fs::rename",
    "std::fs::remove_file",
    "std::fs::remove_dir",
    "std::fs::remove_dir_all",
    "std::fs::create_dir",
    "std::fs::create_dir_all",
    "std::fs::copy",
    "std::fs::hard_link",
    "std::fs::set_permissions",
    "std::fs::soft_link",
    "std::os::unix::fs::symlink",
    "std::os::windows::fs::symlink_file",
    "std::os::windows::fs::symlink_dir",
    "std::fs::File::create",
    "std::fs::File::create_new",
    "std::fs::File::set_len",
    "std::fs::File::set_permissions",
    "std::fs::DirBuilder::create",
    "std::fs::OpenOptions::write",
    "std::fs::OpenOptions::append",
    "std::fs::OpenOptions::create",
    "std::fs::OpenOptions::create_new",
    "std::fs::OpenOptions::truncate",
    "tokio::fs::write",
    "tokio::fs::rename",
    "tokio::fs::remove_file",
    "tokio::fs::remove_dir",
    "tokio::fs::remove_dir_all",
    "tokio::fs::create_dir",
    "tokio::fs::create_dir_all",
    "tokio::fs::copy",
    "tokio::fs::hard_link",
    "tokio::fs::set_permissions",
    "tokio::fs::symlink",
    "tokio::fs::symlink_file",
    "tokio::fs::symlink_dir",
    "tokio::fs::File::create",
    "tokio::fs::File::create_new",
    "tokio::fs::File::set_len",
    "tokio::fs::File::set_permissions",
    "tokio::fs::DirBuilder::create",
    "tokio::fs::OpenOptions::write",
    "tokio::fs::OpenOptions::append",
    "tokio::fs::OpenOptions::create",
    "tokio::fs::OpenOptions::create_new",
    "tokio::fs::OpenOptions::truncate",
    "tempfile::NamedTempFile::new",
    "tempfile::NamedTempFile::new_in",
    "tempfile::NamedTempFile::persist",
    "tempfile::NamedTempFile::persist_noclobber",
    "tempfile::NamedTempFile::keep",
    "tempfile::TempPath::persist",
    "tempfile::TempPath::persist_noclobber",
    "tempfile::TempPath::keep",
    "tempfile::Builder::tempfile_in",
    "fuigo_config::paths::create_dir_all_owner_only",
    "fuigo_config::paths::create_file_owner_only",
    "fuigo_config::paths::write_file_owner_only",
    "fuigo_config::paths::owner_only_file_options",
    "fuigo_config::paths::set_dir_owner_only",
    "fuigo_config::write_through::replace_file_contents",
    "fuigo_secrets::owner_only::restrict_to_owner",
    "fuigo_session_writer::owner_only::create",
    "fuigo_session_writer::owner_only::write",
    "fuigo_session_writer::owner_only::copy",
    "fuigo_session_writer::owner_only::copy_async",
    "fuigo_session_writer::owner_only::write_async",
